name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install server dependencies
        run: uv sync --frozen

      - name: Test frontend helpers
        run: node --test web/js/util.test.mjs

      - name: Test server
        run: uv run pytest -q

      - name: Install terminal dependencies
        working-directory: terminal
        run: uv sync --frozen

      - name: Test terminal
        working-directory: terminal
        run: uv run pytest -q
