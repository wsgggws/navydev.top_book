name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-navydev-top-book
  cancel-in-progress: true

env:
  APP_ROOT: deploy/navydev.top_book
  STAGING_PATH: deploy/navydev.top_book-staging-${{ github.sha }}
  HEALTH_URL: http://127.0.0.1:8010/book/api/v1/health

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install server dependencies
        run: uv sync --frozen

      - name: Test server
        run: uv run pytest -q

      - name: Install terminal dependencies
        working-directory: terminal
        run: uv sync --frozen

      - name: Test terminal
        working-directory: terminal
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package release
        env:
          LECTOR_TOKEN: ${{ secrets.LECTOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LECTOR_TOKEN}" || {
            echo "::error::缺少 GitHub Actions secret: LECTOR_TOKEN"
            exit 1
          }

          mkdir -p release
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf release/app.tgz \
            .dockerignore \
            Dockerfile \
            docker-compose.yml \
            Makefile \
            pyproject.toml \
            uv.lock \
            README.md \
            lector \
            web

          umask 077
          {
            printf 'LECTOR_TOKEN=%s\n' "${LECTOR_TOKEN}"
            printf 'LECTOR_TTS_ENGINE=edge\n'
          } > release/lector.env

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.REMOTE_IP }} >> ~/.ssh/known_hosts

      - name: Create remote staging directory
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}" \
            "rm -rf '${STAGING_PATH}' && mkdir -p '${STAGING_PATH}'"

      - name: Upload release
        run: |
          scp release/app.tgz release/lector.env \
            "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}:${STAGING_PATH}/"

      - name: Activate release
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}" \
            "APP_ROOT='${APP_ROOT}' STAGING_PATH='${STAGING_PATH}' RELEASE_ID='${GITHUB_SHA}' HEALTH_URL='${HEALTH_URL}' bash -s" <<'EOF'
            set -euo pipefail

            APP_ROOT="${HOME}/${APP_ROOT}"
            STAGING_PATH="${HOME}/${STAGING_PATH}"
            test -s "${STAGING_PATH}/app.tgz"
            test -s "${STAGING_PATH}/lector.env"
            grep -Eq '^LECTOR_TOKEN=.+$' "${STAGING_PATH}/lector.env"

            command -v docker >/dev/null || {
              echo "服务器未安装 Docker。" >&2
              exit 1
            }
            docker compose version >/dev/null || {
              echo "服务器缺少 Docker Compose v2。" >&2
              exit 1
            }

            RELEASE_DIR="${APP_ROOT}/releases/${RELEASE_ID}"
            CURRENT_LINK="${APP_ROOT}/current"
            PREVIOUS="$(readlink -f "${CURRENT_LINK}" 2>/dev/null || true)"

            mkdir -p "${RELEASE_DIR}" "${APP_ROOT}/releases"
            tar -xzf "${STAGING_PATH}/app.tgz" -C "${RELEASE_DIR}"
            install -m 0600 "${STAGING_PATH}/lector.env" "${RELEASE_DIR}/.env"

            rollback() {
              if [ -n "${PREVIOUS}" ] && [ -d "${PREVIOUS}" ]; then
                echo "回滚到 ${PREVIOUS}" >&2
                (cd "${PREVIOUS}" && make docker-run)
              fi
            }

            # 先启动新容器；构建或启动失败时旧容器仍在，仍执行一次显式回滚。
            if ! (cd "${RELEASE_DIR}" && make docker-run); then
              rollback
              exit 1
            fi

            healthy=0
            for _ in $(seq 1 30); do
              if curl -fsS "${HEALTH_URL}" >/dev/null; then
                healthy=1
                break
              fi
              sleep 1
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "健康检查失败，回滚到上一个 release。" >&2
              docker logs --tail=200 navydev-top-book || true
              rollback
              exit 1
            fi

            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}.next"
            mv -Tf "${CURRENT_LINK}.next" "${CURRENT_LINK}"

            # 保留五个版本，方便排查和手工回滚。
            ls -1dt "${APP_ROOT}"/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            rm -rf "${STAGING_PATH}"
          EOF
