name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-navydev-top-ebook
  cancel-in-progress: true

env:
  APP_ROOT: deploy/navydev.top_ebook
  STAGING_PATH: deploy/navydev.top_ebook-staging-${{ github.sha }}
  HEALTH_URL: http://127.0.0.1:8010/ebook/api/v1/health

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install server dependencies
        run: uv sync --frozen

      - name: Test frontend helpers
        run: node --test web/js/util.test.mjs

      - name: Test server
        run: uv run pytest -q

      - name: Install terminal dependencies
        working-directory: terminal
        run: uv sync --frozen

      - name: Test terminal
        working-directory: terminal
        run: uv run pytest -q

  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Package release
        env:
          LECTOR_TOKEN: ${{ secrets.LECTOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LECTOR_TOKEN}" || {
            echo "::error::缺少 GitHub Actions secret: LECTOR_TOKEN"
            exit 1
          }

          mkdir -p release
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf release/app.tgz \
            .dockerignore \
            Dockerfile \
            docker-compose.yml \
            Makefile \
            pyproject.toml \
            uv.lock \
            README.md \
            books \
            lector \
            web

          umask 077
          {
            printf 'LECTOR_TOKEN=%s\n' "${LECTOR_TOKEN}"
            printf 'LECTOR_TTS_ENGINE=edge\n'
            printf 'LECTOR_IMAGE=ghcr.nju.edu.cn/%s:%s\n' "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
          } > release/lector.env

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.REMOTE_IP }} >> ~/.ssh/known_hosts

      - name: Create remote staging directory
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}" \
            "rm -rf '${STAGING_PATH}' && mkdir -p '${STAGING_PATH}'"

      - name: Upload release
        run: |
          scp release/app.tgz release/lector.env \
            "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}:${STAGING_PATH}/"

      - name: Activate release
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}" \
            "APP_ROOT='${APP_ROOT}' STAGING_PATH='${STAGING_PATH}' RELEASE_ID='${GITHUB_SHA}' HEALTH_URL='${HEALTH_URL}' bash -s" <<'EOF'
            set -euo pipefail

            APP_ROOT="${HOME}/${APP_ROOT}"
            STAGING_PATH="${HOME}/${STAGING_PATH}"
            test -s "${STAGING_PATH}/app.tgz"
            test -s "${STAGING_PATH}/lector.env"
            grep -Eq '^LECTOR_TOKEN=.+$' "${STAGING_PATH}/lector.env"
            grep -Eq '^LECTOR_IMAGE=.+$' "${STAGING_PATH}/lector.env"

            command -v docker >/dev/null || {
              echo "服务器未安装 Docker。" >&2
              exit 1
            }
            docker compose version >/dev/null || {
              echo "服务器缺少 Docker Compose v2。" >&2
              exit 1
            }
            RELEASE_DIR="${APP_ROOT}/releases/${RELEASE_ID}"
            CURRENT_LINK="${APP_ROOT}/current"
            PREVIOUS="$(readlink -f "${CURRENT_LINK}" 2>/dev/null || true)"
            LEGACY_CONTAINER="navydev-top-book"
            LEGACY_VOLUME="navydev-top-book-data"
            DATA_VOLUME="navydev-top-ebook-data"
            LEGACY_STOPPED=0

            mkdir -p "${RELEASE_DIR}" "${APP_ROOT}/releases"
            tar -xzf "${STAGING_PATH}/app.tgz" -C "${RELEASE_DIR}"
            install -m 0600 "${STAGING_PATH}/lector.env" "${RELEASE_DIR}/.env"

            # 先拉取新镜像，网络失败时旧服务完全不受影响。
            (cd "${RELEASE_DIR}" && docker compose pull)

            rollback() {
              if [ -n "${PREVIOUS}" ] && [ -d "${PREVIOUS}" ]; then
                echo "回滚到 ${PREVIOUS}" >&2
                (cd "${PREVIOUS}" && make docker-release)
              elif [ "${LEGACY_STOPPED}" -eq 1 ]; then
                echo "回滚到旧版容器 ${LEGACY_CONTAINER}" >&2
                docker stop navydev-top-ebook >/dev/null 2>&1 || true
                docker rm navydev-top-ebook >/dev/null 2>&1 || true
                docker start "${LEGACY_CONTAINER}"
              fi
            }

            if docker inspect "${LEGACY_CONTAINER}" >/dev/null 2>&1; then
              docker stop "${LEGACY_CONTAINER}" >/dev/null
              LEGACY_STOPPED=1
            fi

            # 首次改名时把旧数据卷完整复制到新卷；旧卷保留作为备份。
            docker volume create "${DATA_VOLUME}" >/dev/null
            if docker volume inspect "${LEGACY_VOLUME}" >/dev/null 2>&1; then
              if ! docker run --rm \
                -v "${DATA_VOLUME}:/to" \
                swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/python:3.12-slim \
                test -f /to/lector.db; then
                if ! docker run --rm \
                  -v "${LEGACY_VOLUME}:/from:ro" \
                  -v "${DATA_VOLUME}:/to" \
                  swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/python:3.12-slim \
                  sh -c 'cp -a /from/. /to/'; then
                  rollback
                  exit 1
                fi
              fi
            fi

            # 先启动新容器；构建或启动失败时旧容器仍在，仍执行一次显式回滚。
            if ! (cd "${RELEASE_DIR}" && make docker-release); then
              rollback
              exit 1
            fi

            healthy=0
            for _ in $(seq 1 30); do
              if curl -fsS "${HEALTH_URL}" >/dev/null; then
                healthy=1
                break
              fi
              sleep 1
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "健康检查失败，回滚到上一个 release。" >&2
              docker logs --tail=200 navydev-top-ebook || true
              rollback
              exit 1
            fi

            ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}.next"
            mv -Tf "${CURRENT_LINK}.next" "${CURRENT_LINK}"

            # 保留五个版本，方便排查和手工回滚。
            ls -1dt "${APP_ROOT}"/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf
            if [ "${LEGACY_STOPPED}" -eq 1 ]; then
              docker rm "${LEGACY_CONTAINER}" >/dev/null 2>&1 || true
            fi
            rm -rf "${STAGING_PATH}"
          EOF

  build-image:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
