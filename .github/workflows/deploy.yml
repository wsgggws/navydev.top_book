name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-navydev-top-book
  cancel-in-progress: true

env:
  APP_ROOT: /opt/navydev.top_book
  STAGING_PATH: /tmp/navydev.top_book-${{ github.sha }}
  HEALTH_URL: http://127.0.0.1:8010/book/api/v1/health

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install server dependencies
        run: uv sync --frozen

      - name: Test server
        run: uv run pytest -q

      - name: Install terminal dependencies
        working-directory: terminal
        run: uv sync --frozen

      - name: Test terminal
        working-directory: terminal
        run: uv run pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package release
        env:
          LECTOR_TOKEN: ${{ secrets.LECTOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${LECTOR_TOKEN}" || {
            echo "::error::缺少 GitHub Actions secret: LECTOR_TOKEN"
            exit 1
          }

          mkdir -p release
          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            -czf release/app.tgz \
            pyproject.toml uv.lock README.md lector web deploy/lector.service

          umask 077
          {
            printf 'LECTOR_TOKEN=%s\n' "${LECTOR_TOKEN}"
            printf 'LECTOR_DATA_DIR=/var/lib/lector\n'
            printf 'LECTOR_HOST=127.0.0.1\n'
            printf 'LECTOR_PORT=8010\n'
            printf 'LECTOR_BASE_PATH=/book\n'
            printf 'LECTOR_TTS_ENGINE=edge\n'
          } > release/lector.env

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.REMOTE_IP }} >> ~/.ssh/known_hosts

      - name: Create remote staging directory
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}" \
            "rm -rf '${STAGING_PATH}' && mkdir -p '${STAGING_PATH}'"

      - name: Upload release
        run: |
          scp release/app.tgz release/lector.env \
            "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}:${STAGING_PATH}/"

      - name: Activate release
        run: |
          ssh "${{ secrets.SSH_USER }}@${{ secrets.REMOTE_IP }}" \
            "APP_ROOT='${APP_ROOT}' STAGING_PATH='${STAGING_PATH}' RELEASE_ID='${GITHUB_SHA}' HEALTH_URL='${HEALTH_URL}' bash -s" <<'EOF'
            set -euo pipefail

            SUDO=""
            if [ "$(id -u)" -ne 0 ]; then
              SUDO="sudo"
            fi

            test -s "${STAGING_PATH}/app.tgz"
            test -s "${STAGING_PATH}/lector.env"
            grep -Eq '^LECTOR_TOKEN=.+$' "${STAGING_PATH}/lector.env"

            UV_BIN="$(command -v uv)"
            test -n "${UV_BIN}" || {
              echo "服务器未安装 uv；请先安装后再发布。" >&2
              exit 1
            }

            RELEASE_DIR="${APP_ROOT}/releases/${RELEASE_ID}"
            CURRENT_LINK="${APP_ROOT}/current"
            PREVIOUS="$(readlink -f "${CURRENT_LINK}" 2>/dev/null || true)"

            ${SUDO} mkdir -p "${RELEASE_DIR}" "${APP_ROOT}/releases"
            ${SUDO} tar -xzf "${STAGING_PATH}/app.tgz" -C "${RELEASE_DIR}"
            ${SUDO} chown -R root:root "${RELEASE_DIR}"

            # 依赖装在 release 自己的 .venv 里；旧版本因此可以原样回滚。
            ${SUDO} env UV_CACHE_DIR=/var/cache/uv UV_PYTHON=3.12 \
              "${UV_BIN}" sync --frozen --no-dev --project "${RELEASE_DIR}"

            if ! id lector >/dev/null 2>&1; then
              ${SUDO} useradd --system --home "${APP_ROOT}" --shell /usr/sbin/nologin lector
            fi
            ${SUDO} install -d -o lector -g lector -m 0750 /var/lib/lector
            ${SUDO} install -d -m 0700 /etc/lector
            ${SUDO} install -m 0600 -o root -g root \
              "${STAGING_PATH}/lector.env" /etc/lector/env
            ${SUDO} install -m 0644 \
              "${RELEASE_DIR}/deploy/lector.service" /etc/systemd/system/lector.service

            ${SUDO} ln -sfn "${RELEASE_DIR}" "${CURRENT_LINK}.next"
            ${SUDO} mv -Tf "${CURRENT_LINK}.next" "${CURRENT_LINK}"
            ${SUDO} systemctl daemon-reload
            ${SUDO} systemctl enable lector
            ${SUDO} systemctl restart lector

            healthy=0
            for _ in $(seq 1 30); do
              if curl -fsS "${HEALTH_URL}" >/dev/null; then
                healthy=1
                break
              fi
              sleep 1
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "健康检查失败，回滚到上一个 release。" >&2
              if [ -n "${PREVIOUS}" ]; then
                ${SUDO} ln -sfn "${PREVIOUS}" "${CURRENT_LINK}.next"
                ${SUDO} mv -Tf "${CURRENT_LINK}.next" "${CURRENT_LINK}"
                ${SUDO} systemctl restart lector || true
              fi
              exit 1
            fi

            # 保留五个版本，方便排查和手工回滚。
            ${SUDO} sh -c "ls -1dt '${APP_ROOT}'/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf"
            rm -rf "${STAGING_PATH}"
          EOF
