name: navydev-top-ebook

services:
  lector:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${LECTOR_IMAGE:-ghcr.nju.edu.cn/wsgggws/navydev.top_ebook:latest}
    container_name: navydev-top-ebook
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LECTOR_DATA_DIR: /data
      LECTOR_HOST: 0.0.0.0
      LECTOR_PORT: 8010
      LECTOR_BASE_PATH: /ebook
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - lector_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/ebook/api/v1/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  lector_data:
    name: navydev-top-ebook-data
