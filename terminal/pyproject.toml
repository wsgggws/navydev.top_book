# 终端端 —— 独立项目。
#
# 它只通过 HTTP 与服务端打交道，不依赖服务端的任何代码，
# 所以这个目录可以单独装、单独发版，服务端改了也不影响它。
[project]
name = "lector-tui"
version = "1.3.9"
description = "Lector 的只读终端端：读书、听书、独立记录本机阅读位置"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "pillow>=13.0.0",
    "textual>=8.2.8,<8.3",
    "textual-image[textual]>=0.14.2,<0.15",
]

[project.scripts]
lector = "lector_tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lector_tui"]
