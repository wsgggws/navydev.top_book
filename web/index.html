<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23c8791f'/%3E%3Crect x='9' y='7' width='3' height='18' rx='1.5' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/library.css">
<link rel="stylesheet" href="styles/reader.css">
<link rel="stylesheet" href="styles/player.css">
</head>
<body class="view-library">

<header class="topbar" id="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="btn-menu" aria-label="目录" title="目录 (t)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
    <button class="icon-btn" id="btn-back" aria-label="返回书架" title="返回书架 (Esc)" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5"/></svg>
    </button>
    <div class="topbar-title">
      <span id="topbar-book">Lector</span>
      <span class="topbar-chapter" id="topbar-chapter"></span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" id="btn-theme" aria-label="切换主题" title="切换主题 (m)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.6 3.6l1.4 1.4M15 15l1.4 1.4M16.4 3.6L15 5M5 15l-1.4 1.4"/></svg>
    </button>
    <button class="icon-btn" id="btn-font" aria-label="字号" title="字号 (+/-)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 15L8 4l5 11M4.8 11h6.4M13 15l2.4-5 2.6 5"/></svg>
    </button>
    <button class="icon-btn" id="btn-settings" aria-label="设置" title="设置 (s)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2v2.2M10 15.8V18M18 10h-2.2M4.2 10H2M15.7 4.3l-1.6 1.6M5.9 14.1l-1.6 1.6M15.7 15.7l-1.6-1.6M5.9 5.9L4.3 4.3"/></svg>
    </button>
  </div>
</header>

<main class="stage">
  <!-- 书架 -->
  <section class="library" id="library" aria-label="书架">
    <div class="library-head">
      <h1>书架</h1>
      <button class="btn btn-primary" id="btn-import">导入 EPUB</button>
      <input type="file" id="file-input" accept=".epub,application/epub+zip" hidden>
    </div>
    <div class="dropzone" id="dropzone">
      <div class="grid" id="book-grid"></div>
      <div class="empty" id="library-empty" hidden>
        <p class="empty-title">书架还是空的</p>
        <p class="empty-hint">把一本 EPUB 拖进来，或点上面的「导入 EPUB」。只支持 EPUB。</p>
      </div>
    </div>
  </section>

  <!-- 阅读 -->
  <section class="reader" id="reader" aria-label="正文" hidden>
    <div class="reader-scroll" id="reader-scroll">
      <article class="column" id="column" role="document"></article>
    </div>
  </section>
</main>

<!-- 目录抽屉 -->
<aside class="drawer drawer-left" id="drawer-toc" aria-label="目录" hidden>
  <div class="drawer-head">
    <div class="search-box">
      <input type="search" id="search-input" placeholder="搜索全书" aria-label="搜索全书">
    </div>
    <button class="icon-btn" id="btn-toc-close" aria-label="关闭目录" title="关闭 (Esc)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <nav class="toc" id="toc"></nav>
    <div class="search-results" id="search-results" hidden></div>
  </div>
</aside>

<!-- 设置抽屉 -->
<aside class="drawer drawer-right" id="drawer-settings" aria-label="设置" hidden>
  <div class="drawer-head">
    <h2>设置</h2>
    <button class="icon-btn" id="btn-settings-close" aria-label="关闭设置" title="关闭 (Esc)">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <section class="settings-group">
      <h3>排版</h3>
      <label class="field"><span>字号 <b id="v-fontsize">18px</b></span>
        <input type="range" id="s-fontsize" min="14" max="26" step="1"></label>
      <label class="field"><span>行距 <b id="v-lineheight">1.9</b></span>
        <input type="range" id="s-lineheight" min="1.5" max="2.4" step="0.05"></label>
      <label class="field"><span>段距 <b id="v-paraspace">0.9em</b></span>
        <input type="range" id="s-paraspace" min="0.4" max="1.6" step="0.05"></label>
      <label class="field"><span>列宽 <b id="v-measure">36em</b></span>
        <input type="range" id="s-measure" min="26" max="48" step="1"></label>
      <label class="field field-check"><input type="checkbox" id="s-indent"><span>段首缩进 2em</span></label>
    </section>
    <section class="settings-group">
      <h3>主题</h3>
      <div class="seg" id="s-theme">
        <button data-theme="paper">纸白</button>
        <button data-theme="sepia">羊皮</button>
        <button data-theme="night">夜间</button>
        <button data-theme="auto">跟随系统</button>
      </div>
    </section>
    <section class="settings-group">
      <h3>朗读</h3>
      <label class="field"><span>音色</span>
        <select id="s-voice"></select></label>
      <label class="field"><span>倍速 <b id="v-rate">1.0×</b></span>
        <input type="range" id="s-rate" min="0.75" max="2" step="0.05"></label>
      <label class="field"><span>句间停顿 <b id="v-gap">0.0s</b></span>
        <input type="range" id="s-gap" min="0" max="1.5" step="0.1"></label>
    </section>
    <section class="settings-group">
      <h3>数据</h3>
      <button class="btn" id="btn-share">分享当前位置</button>
      <button class="btn" id="btn-warm">预生成本章音频</button>
      <button class="btn" id="btn-clear-audio">清除本书音频缓存</button>
      <button class="btn" id="btn-export-progress">导出进度</button>
    </section>
    <section class="settings-group">
      <h3>快捷键</h3>
      <ul class="keys">
        <li><kbd>←</kbd><kbd>→</kbd> 上一句 / 下一句</li>
        <li><kbd>Space</kbd> 播放 / 暂停</li>
        <li><kbd>↑</kbd><kbd>↓</kbd> 滚动一行</li>
        <li><kbd>PgUp</kbd><kbd>PgDn</kbd> 翻页</li>
        <li><kbd>Home</kbd><kbd>End</kbd> 章首 / 章末</li>
        <li><kbd>[</kbd><kbd>]</kbd> 上 / 下一章</li>
        <li><kbd>t</kbd> 目录　<kbd>/</kbd> 搜索　<kbd>s</kbd> 设置</li>
        <li><kbd>+</kbd><kbd>-</kbd> 字号　<kbd>f</kbd> 沉浸　<kbd>Esc</kbd> 退出</li>
      </ul>
    </section>
  </div>
</aside>

<!-- 听书条 -->
<footer class="player" id="player" hidden>
  <div class="player-left">
    <button class="icon-btn" id="btn-prev" aria-label="上一句" title="上一句">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 5v10M15 5l-7 5 7 5z"/></svg>
    </button>
    <button class="icon-btn icon-btn-primary" id="btn-play" aria-label="播放" title="播放 / 暂停 (Space)">
      <svg viewBox="0 0 20 20" aria-hidden="true" id="play-icon"><path d="M6 4l10 6-10 6z"/></svg>
    </button>
    <button class="icon-btn" id="btn-next" aria-label="下一句" title="下一句">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M14 5v10M5 5l7 5-7 5z"/></svg>
    </button>
  </div>
  <div class="player-mid">
    <div class="player-title" id="player-chapter">—</div>
    <div class="player-bar"><div class="player-bar-fill" id="player-progress"></div></div>
  </div>
  <div class="player-right">
    <span class="player-time" id="player-time">00:00 / 00:00</span>
    <button class="text-btn" id="btn-follow" title="跟随朗读位置">跟随<span class="dot" id="follow-dot" hidden></span></button>
    <button class="text-btn" id="btn-rate" title="倍速">1.0×</button>
    <button class="text-btn" id="btn-voice" title="音色">—</button>
    <button class="icon-btn" id="btn-player-close" aria-label="关闭听书条" title="关闭">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
    </button>
  </div>
  <div class="player-status" id="player-status" aria-live="polite"></div>
</footer>

<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
