[project]
name = "navydev.top_ebook"
# 与 lector/config.py 的 APP_VERSION 保持一致。
version = "1.0.0"
description = "有声电子书服务端：EPUB 解析、语音合成、HTTP 接口，以及网页端资源"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "edge-tts>=7.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
lector-server = "lector.web:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # 终端端是独立项目（terminal/），这里只在开发期引入，好让终端的
    # 集成测试能在服务端旁边跑起来。运行时两者互不依赖。
    "lector-tui @ file:///${PROJECT_ROOT}/terminal",
]

[build-system]
# 构建期依赖，不进运行时环境，运行时依赖白名单不受影响。
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 服务端一个包；终端端在 terminal/，是另一个项目。
packages = ["lector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
