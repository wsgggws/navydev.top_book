[project]
name = "lector"
# 与 lector/config.py 的 APP_VERSION 保持一致。
version = "1.0.0"
description = "EPUB 阅读器 + 有声书播放器：网页端与终端端共享同一份内容与同一个阅读位置"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "edge-tts>=7.0",
    "textual>=0.80",
    "python-multipart>=0.0.9",
]

[project.scripts]
lector-server = "lector.web:main"
lector = "lector_tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
# 构建期依赖，不进运行时环境，运行时依赖白名单不受影响。
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 两个顶层包：服务端与终端端。
packages = ["lector", "terminal/lector_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
